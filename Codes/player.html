<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Omari.to</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="/Codes/style.css">
    <link rel="icon" href="/Public/Images/Logo.png">

    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Poppins:wght@300;400;500&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>

    <style>
        :root {
            --primary: #d4bf86;
            --secondary: #dcc78e;
            --dark: #0f0f0f;
            --main: white;
            --accent: #FF9F1C;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            scrollbar-width: none;
        }

        a {
            text-decoration: none;
            color: white;
        }

        body {
            font-family: "Poppins", sans-serif;
            background: var(--dark);
            color: white;
            overflow-x: hidden;
        }

        /* ===== NAVBAR ===== */
        .top-navbar {
            position: fixed;
            top: 0;
            width: 100%;
            padding: 15px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(15, 15, 15, 0.9);
            backdrop-filter: blur(20px);
            z-index: 1000;
            border-bottom: 1px solid rgba(255, 159, 28, 0.15);
        }

        .logo a {
            display: flex;
            align-items: center;
            text-decoration: none;
        }

        .logo img {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--primary);
            box-shadow: 0 0 15px rgba(212, 191, 134, 0.3);
        }

        .brand-name {
            font-family: "Playfair Display", serif;
            font-size: 24px;
            margin-left: 12px;
            font-weight: 600;
            color: white;
            letter-spacing: 1px;
            transition: 0.3s ease;
        }

        .brand-name .dot {
            color: var(--primary);
        }

        .brand-name:hover {
            color: var(--primary);
        }

        .nav-links {
            list-style: none;
            display: flex;
            align-items: center;
            gap: 25px;
        }

        .nav-links li {
            position: relative;
            cursor: pointer;
            transition: 0.3s;
            font-size: 15px;
        }

        .nav-links li:hover {
            color: var(--primary);
        }

        .nav-links li::after {
            content: '';
            position: absolute;
            left: 0;
            bottom: -4px;
            width: 0%;
            height: 2px;
            background: var(--primary);
            transition: width 0.4s ease;
            border-radius: 2px;
        }

        .nav-links li:hover::after {
            width: 100%;
        }

        /* Mobile Nav */
        .mobile-icons {
            display: none;
            gap: 20px;
            align-items: center;
        }

        .mobile-icons i {
            font-size: 1.4rem;
            cursor: pointer;
            transition: 0.3s;
            color: var(--primary);
        }

        .mobile-icons i:hover {
            color: var(--secondary);
            transform: scale(1.1);
        }

        @media (max-width: 900px) {
            .nav-links {
                display: none;
            }

            .mobile-icons {
                display: flex;
            }
        }

        /* ===== SIDE MENU ===== */
        .side-menu-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1100;
            display: none;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .side-menu-overlay.show {
            opacity: 1;
        }

        .side-menu {
            position: fixed;
            top: 0;
            right: 0;
            width: 280px;
            height: 100vh;
            background: rgba(20, 20, 20, 0.98);
            backdrop-filter: blur(30px);
            border-left: 1px solid rgba(255, 159, 28, 0.2);
            z-index: 1200;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-evenly;
            transform: translateX(100%);
            transition: transform 0.3s ease;
            list-style: none;
        }

        .side-menu.show {
            transform: translateX(0);
        }

        .side-menu a {
            font-size: 18px;
            padding: 12px 0;
            transition: 0.3s;
            display: block;
        }

        .side-menu a:hover {
            color: var(--primary);
            transform: translateX(-5px);
        }

        .side-menu-close {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--primary);
            transition: 0.3s;
        }

        .side-menu-close:hover {
            color: var(--secondary);
            transform: rotate(90deg);
        }

        /* ===== LIKE BUTTON ===== */
        .like-section {
            margin: 20px 0;
        }

        .like-btn {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 24px;
            background: rgba(212, 191, 134, 0.1);
            border: 1px solid var(--primary);
            border-radius: 30px;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        .like-btn:hover {
            background: rgba(212, 191, 134, 0.2);
            transform: scale(1.05);
        }

        .like-btn.liked {
            background: rgba(255, 159, 28, 0.2);
            border-color: var(--accent);
        }

        .like-btn.liked i {
            color: var(--accent);
        }

        /* ===== COMMENTS SECTION ===== */
        .comments-section {
            margin: 30px 0;
            padding: 20px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
        }

        .comments-section h3 {
            margin-bottom: 20px;
            color: var(--primary);
        }

        .comments-list {
            max-height: 400px;
            overflow-y: auto;
            margin-bottom: 20px;
        }

        .comment-item {
            padding: 15px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            margin-bottom: 10px;
        }

        .comment-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
        }

        .comment-avatar {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            object-fit: cover;
        }

        .comment-user {
            font-weight: 600;
            color: var(--primary);
        }

        .comment-date {
            font-size: 12px;
            color: #888;
            margin-left: auto;
        }

        .comment-text {
            color: #ccc;
            line-height: 1.5;
        }

        .comment-input-section {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        #commentInput {
            width: 100%;
            padding: 12px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            color: white;
            font-family: "Poppins", sans-serif;
            resize: vertical;
        }

        #commentInput:focus {
            outline: none;
            border-color: var(--primary);
        }

        .post-comment-btn {
            padding: 12px 24px;
            background: var(--primary);
            border: none;
            border-radius: 25px;
            color: black;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            align-self: flex-start;
        }

        .post-comment-btn:hover {
            background: var(--secondary);
        }

        .delete-comment-btn {
            background: none;
            border: none;
            color: #ff6b6b;
            cursor: pointer;
            font-size: 12px;
            margin-top: 5px;
        }

        .delete-comment-btn:hover {
            text-decoration: underline;
        }

        /* ===== MOBILE SEARCH ===== */
        .mobile-search-area {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: rgba(15, 15, 15, 0.98);
            backdrop-filter: blur(20px);
            z-index: 1300;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 300px;
            transform: translateY(-100%);
            transition: transform 0.3s ease;
        }

        .mobile-search-area.show {
            transform: translateY(0);
        }

        .mobile-search-box {
            display: flex;
            align-items: center;
            width: 60%;
        }

        .mobile-search-box input {
            width: 100%;
            height: 45px;
            border-radius: 10px 0 0 10px;
            border: 1px solid rgba(255, 159, 28, 0.3);
            background: rgba(255, 255, 255, 0.05);
            color: white;
            padding: 0 15px;
            outline: none;
            font-family: "Poppins", sans-serif;
            font-size: 14px;
        }

        .mobile-search-box input::placeholder {
            color: #888;
        }

        .mobile-search-box input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 15px rgba(255, 159, 28, 0.2);
        }

        .mobile-search-box button {
            width: 50px;
            height: 45px;
            border-radius: 0 10px 10px 0;
            border: none;
            background: linear-gradient(45deg, var(--primary), var(--secondary));
            cursor: pointer;
            color: black;
            font-size: 16px;
            transition: 0.3s;
        }

        .mobile-search-box button:hover {
            box-shadow: 0 0 15px rgba(255, 159, 28, 0.4);
        }

        /* ===== PAGE LAYOUT ===== */
        .player-page {
            display: flex;
            gap: 30px;
            padding: 100px 4% 30px;
            min-height: 100vh;
        }

        /* ===== MAIN PLAYER ===== */
        .main-player {
            flex: 2;
            display: flex;
            flex-direction: column;
        }

        .video-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 16/9;
            background: #000;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 0 40px rgba(255, 159, 28, 0.15), 0 10px 40px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 159, 28, 0.1);
        }

        .video-wrapper video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            background: #000;
        }

        .video-wrapper .video-element {
            display: none;
        }

        .video-wrapper.mode-tiktok .video-element {
            display: block;
        }

                    <p>Omari.to is a modern digital media and content creation brand focused on delivering engaging
                        short-form entertainment, viral social media experiences, and creative online storytelling for a
                        global audience. Built around the fast-growing world of social platforms and digital culture,
                        Omari.to represents a new generation of online creators who combine creativity, technology, and
                        entertainment into one interactive experience.

                        Social media personality and TikTok content creator who rose to fame through the use of his
                        omari.to account. He shares lip-sync and comedy videos that often incorporate the platform's
                        filters for effect.

                        The platform is primarily recognized through its TikTok presence, where it shares trending
                        videos, creative edits, entertainment clips, and engaging media content designed for viewers who
                        enjoy modern social entertainment. With the rapid growth of platforms like TikTok, short-form
                        video content has become one of the most influential forms of digital communication, and
                        Omari.to participates in this space by producing visually engaging and audience-focused content.

                        Omari.to focuses on creating content that is fast, entertaining, visually appealing, and
                        optimized for modern audiences who consume media through mobile devices and social networking
                        platforms. The brand reflects the evolution of online entertainment, where creators are able to
                        build communities and digital identities through consistent creative output and audience
                        interaction.</p>
                    <p>In addition to social media content, Omari.to also represents a broader digital identity that can
                        include web experiences, media branding, creative design, and online community engagement. The
                        platform’s visual style and online presentation are inspired by modern digital trends, combining
                        simplicity with strong visual impact to create an immersive experience for viewers and
                        followers.

                        One of the core strengths of Omari.to is its focus on audience engagement. Through trending
                        media formats, short-form storytelling, and creative edits, the platform aims to keep viewers
                        entertained while maintaining a recognizable digital presence. As social media continues to

                        One of the most recognizable places in Almaty is the Medeu skating rink and the Shymbulak ski

                    </p>
                    <p>The city’s economy is one of the strongest in Kazakhstan, with development in finance,

            <!-- Section 2: Left Image, Right Text -->
            <div class="legend-row reverse" data-category="culture">
                <div class="legend-text scrollable-box">
                    <h3>Kazakhstan Culture</h3>
                    <p>The culture of Kazakhstan is one of the richest and most diverse in Central Asia, shaped by
                        centuries of history, nomadic traditions, hospitality, music, art, and modern development.
                        Located between Europe and Asia, Kazakhstan has been influenced by many civilizations throughout
                        history, creating a unique cultural identity that combines ancient traditions with modern
                        lifestyles. The people of Kazakhstan are known for their warmth, respect for family, strong
                        community values, and deep pride in their national heritage.

                        Historically, Kazakh culture developed from the traditions of nomadic tribes who traveled across
                        the vast steppes of Central Asia. These nomadic roots remain an important part of the country’s
                        identity even today. Horses played a major role in traditional Kazakh life, symbolizing freedom,
                        strength, and survival across the open grasslands. Traditional yurts, portable round tents used
                        by nomads, are still recognized as an important cultural symbol of Kazakhstan and represent the
                        country’s connection to its historical way of life.

                        Hospitality is one of the most respected values in Kazakh culture. Guests are treated with great
                        honor, and welcoming visitors with food, tea, and kindness is considered an important tradition.
                        Family relationships and respect for elders are central parts of daily life, and many cultural
                        customs are based on unity, loyalty, and social respect within communities.

                        Kazakhstan is also famous for its traditional music and instruments. One of the most iconic
                        instruments is the dombra, a two-stringed musical instrument that has been part of Kazakh
                        culture for centuries. Traditional music often tells stories about history, heroism, nature, and
                        the lives of nomadic people. Music and storytelling remain important parts of celebrations,
                        festivals, and cultural events across the country.
                    </p>
                    <p>Kazakh cuisine reflects the country’s nomadic history and multicultural influences. Traditional
                        foods such as beshbarmak, kazy, and various dairy products are popular throughout the country.
                        Tea culture is also extremely important, and tea is commonly served during family gatherings and
                        social meetings as a symbol of hospitality and friendship.

                        Modern Kazakhstan combines these traditional values with rapid urban development and
                        international influence. Cities like Almaty and Astana feature modern architecture, technology,
                        fashion, entertainment, and growing digital industries while still preserving cultural heritage
                        and traditions. Young people in Kazakhstan are increasingly active in music, sports, social
                        media, film production, and digital content creation, helping the country become more visible
                        internationally.

                        Festivals and national celebrations are another major part of Kazakh culture. One of the most
                        important celebrations is Nauryz, the traditional New Year festival celebrated in spring. Nauryz
                        represents renewal, unity, peace, and new beginnings, bringing families and communities together
                        through music, food, cultural performances, and traditional activities.

                        Kazakhstan’s culture also reflects its multicultural society. Many ethnic groups and communities
                        live together in the country, contributing to a diverse environment where different languages,
                        traditions, and customs coexist peacefully. This diversity has helped shape Kazakhstan into a
                        modern nation that values both tradition and international cooperation.

                        Today, Kazakhstan continues to grow as a center of culture, tourism, education, and digital
                        creativity in Central Asia. Through art, music, social media, entertainment, and modern
                        technology, the younger generation is introducing Kazakh culture to global audiences while still
                        preserving the traditions and history that make the country unique.</p>
                </div>

            <div class="legend-row reverse" data-category="travel">

                    <h3>South Korea</h3>
                    <p>South Korea, officially known as the Republic of Korea (ROK), is one of the world's most
                        technologically advanced and culturally influential countries. Located in East Asia on the
                        southern half of the Korean Peninsula, South Korea is bordered by the Yellow Sea, the East Sea
                        (Sea of Japan), and North Korea. Over the past few decades, the country has transformed from a
                        developing nation into one of the world's leading economies, becoming internationally recognized
                        for its innovation, education, entertainment, and modern infrastructure. Cities such as Seoul,
                        Busan, Incheon, and Daegu showcase impressive skylines, smart transportation systems, and
                        vibrant urban lifestyles that attract millions of visitors every year.

                        South Korea is a country where centuries-old traditions exist alongside cutting-edge technology.
                        Ancient palaces, Buddhist temples, traditional hanok villages, and historic fortresses stand
                        beautifully beside futuristic skyscrapers and digital smart cities. Seoul, the capital city,
                        perfectly represents this harmony by combining landmarks such as Gyeongbokgung Palace and
                        Bukchon Hanok Village with modern attractions like Lotte World Tower, Dongdaemun Design Plaza,
                        and the famous N Seoul Tower. This unique blend of history and innovation makes South Korea one
                        of the most fascinating travel destinations in the world.

                        The country has become a global cultural powerhouse through the worldwide popularity of K-pop,
                        K-dramas, Korean cinema, fashion, and beauty products. Entertainment companies have introduced
                        Korean music and television to international audiences, while award-winning films and television
                        series have further strengthened South Korea's influence across the globe. Korean fashion,
                        skincare, gaming, and digital content continue inspiring millions of people, making the country
                        one of the leading creative industries in Asia.

                        South Korean culture places strong importance on respect, family values, education, discipline,
                        and hospitality. Traditional customs remain deeply respected despite rapid modernization.
                        Visitors can experience colorful cultural festivals, tea ceremonies, traditional clothing known
                        as Hanbok, and authentic Korean cuisine. Famous dishes such as Kimchi, Bibimbap, Bulgogi,
                        Tteokbokki, Samgyeopsal, and Korean barbecue have become internationally loved and represent the
                        country's rich culinary heritage. Food markets, street vendors, and modern restaurants together
                        create an unforgettable dining experience.</p>
                    <p>South Korea is also recognized as one of the world's leaders in technology, electronics,
                        automotive manufacturing, robotics, artificial intelligence, and high-speed internet. Global
                        companies such as Samsung, LG, Hyundai, Kia, and SK Group have helped establish the country's
                        reputation for innovation and engineering excellence. High-speed trains, efficient public
                        transportation, smart cities, and advanced digital infrastructure make South Korea one of the
                        most connected and technologically advanced nations on Earth.

                        Nature is another remarkable aspect of South Korea. Beyond its modern cities, the country offers
                        beautiful mountains, forests, rivers, beaches, and national parks. Destinations such as Jeju
                        Island, Seoraksan National Park, Nami Island, and Busan's coastline provide breathtaking scenery
                        throughout the year. Cherry blossom festivals in spring, green mountains during summer, colorful
                        autumn forests, and snowy winter landscapes make South Korea an attractive destination in every
                        season.

                        Today, South Korea stands as a symbol of innovation, resilience, creativity, and global
                        influence. Its ability to preserve centuries-old traditions while embracing futuristic
                        technology has made it one of the world's most admired countries. Whether visitors are
                        interested in history, technology, fashion, entertainment, food, or natural beauty, South Korea
                        offers a unique experience that combines modern luxury with rich cultural heritage, making it
                        one of the premier destinations in Asia.</p>

                    <h3>Azerbaijan</h3>
                    <p>Azerbaijan is a beautiful country located between Eastern Europe and Western Asia, known for its

                        Azerbaijan has a deep connection to ancient fire worship traditions due to its natural gas
                        reserves and burning mountain landscapes. The country combines Turkic, Persian, Islamic, and
                        Caucasian cultural influences, creating a unique national identity and heritage.

                        The capital city, Baku, is one of the most modern cities in the region and is famous for its
                        futuristic architecture, luxury buildings, and Caspian Sea coastline. At the same time, Baku
                        preserves historical areas such as the Old City, where visitors can explore ancient streets,
                        mosques, palaces, and traditional markets. The contrast between historical architecture and
                        modern skyscrapers makes the city visually unique.
                    </p>
                    <p>Azerbaijan is also known for its beautiful natural landscapes, including mountains, forests,
                        lakes, and coastal regions. The Caucasus Mountains provide stunning scenery and opportunities
                        for hiking and tourism. Rural villages preserve traditional lifestyles, hospitality, and local
                        customs that have existed for generations.

                        Music and art are important parts of Azerbaijani culture. Traditional mugham music, carpets, and
                        folk dances represent centuries of artistic tradition. Azerbaijani cuisine is rich in flavor and
                        includes dishes such as plov, kebabs, dolma, and traditional sweets. Tea culture is also highly
                        important in social gatherings and hospitality.

                        Today, Azerbaijan continues developing as a center for tourism, energy, and international
                        business while preserving its cultural traditions and historical identity. The country
                        represents a powerful combination of modern progress, natural beauty, and historical richness in

            <div class="legend-row" data-category="travel">
                <div class="legend-text scrollable-box">
                    <h3>Kyrgyzstan</h3>
                    <p>Kyrgyzstan is one of the most naturally breathtaking countries in Central Asia, famous for its
                        massive mountain ranges, crystal-clear lakes, green valleys, and deeply rooted nomadic
                        traditions. Surrounded by the Tian Shan mountains, the country offers some of the most stunning
                        natural scenery in the region. Travelers visiting Kyrgyzstan often experience peaceful
                        landscapes filled with snow-covered peaks, rivers, alpine meadows, and traditional villages that
                        preserve centuries-old cultural traditions. The country’s untouched beauty and fresh mountain
                        environment make it a paradise for nature lovers and adventure travelers.

                        The nomadic heritage of Kyrgyzstan remains a very important part of national identity and
                        culture. For centuries, Kyrgyz people lived as nomads, moving across the mountains and
                        grasslands with horses and livestock. Even today, traditional yurts, horseback riding, eagle
                        hunting, and seasonal migrations continue in rural areas. Horses are highly respected in Kyrgyz
                        culture and symbolize freedom, strength, and connection with nature. Visitors often experience
                        authentic cultural activities such as staying in yurts, riding horses through mountain valleys,
                        and participating in traditional festivals.
                    </p>
                    <p> Kyrgyzstan is also known for its beautiful lakes, especially Issyk-Kul Lake, one of the largest
                        mountain lakes in the world. The lake attracts tourists from across Central Asia because of its
                        clear blue water, mountain scenery, and relaxing atmosphere. During summer, visitors enjoy
                        beaches, boating, hiking, and exploring nearby villages. The country’s landscapes are ideal for
                        outdoor sports such as trekking, camping, skiing, and mountaineering.

                        The culture of Kyrgyzstan reflects strong values of hospitality, family, and respect for
                        tradition. Guests are warmly welcomed with traditional foods, tea, and local customs. Kyrgyz
                        music, storytelling, and handcrafted art are important parts of cultural life. Traditional foods
                        such as beshbarmak and local dairy products reflect the country’s nomadic roots and mountain
                        lifestyle.

                        Today, Kyrgyzstan continues growing as an important destination for eco-tourism and cultural
                        exploration. While modern cities such as Bishkek develop with technology and business, much of
                        the country still preserves its natural beauty and traditional way of life. Kyrgyzstan
                        represents a powerful connection between nature, history, and authentic Central Asian culture.
                    </p>
                </div>

            <div class="legend-row reverse" data-category="travel">
                <div class="legend-text scrollable-box">
                    <h3>Turkey</h3>
                    <p>Turkey is one of the world’s most historically rich and culturally diverse countries, located at
                        the crossroads of Europe and Asia. Because of its unique geographical position, Turkey has been
                        influenced by many civilizations throughout history, including the Byzantine, Roman, Seljuk, and
                        Ottoman Empires. This historical background has created a country filled with magnificent
                        architecture, ancient landmarks, vibrant traditions, and modern cities that attract millions of
                        tourists every year.
                        The city of Istanbul is one of Turkey’s most famous destinations and is the only major city in
                        the world located on two continents. Istanbul is known for its grand mosques, historical
                        palaces, bustling bazaars, and modern lifestyle. Landmarks such as Hagia Sophia, the Blue
                        Mosque, Topkapi Palace, and the Grand Bazaar represent centuries of history and cultural
                        influence. The city combines Islamic heritage, European architecture, and modern urban
                        development in a truly unique way.
                    </p>
                    <p>Turkey is also famous for its natural beauty and tourism destinations. Cappadocia attracts
                        visitors with its unique rock formations and hot air balloons, while coastal regions such as
                        Antalya and Bodrum are known for beaches, resorts, and Mediterranean scenery. Mountains,
                        forests, rivers, and historical ruins across the country make Turkey one of the most diverse
                        travel destinations in the world.

                        Turkish culture is deeply connected to hospitality, family values, art, and cuisine. Turkish
                        food is internationally famous for dishes such as kebabs, baklava, pide, and traditional tea
                        culture. Music, folk dances, carpets, and handicrafts remain important parts of cultural life.
                        Turkish traditions reflect a combination of Central Asian roots, Islamic values, and
                        Mediterranean influence.

                        Modern Turkey plays a major role in tourism, international trade, fashion, entertainment, and
                        media. While preserving its historical identity and traditions, the country continues developing
                        modern infrastructure, technology, and global connections. Turkey represents a powerful blend of
                        ancient civilization, cultural richness, and modern international influence.
                    </p>
                </div>

                    <img src="/Public/Images/Turkey.png" alt="Culture Food">
                </div>
            </div>

            <div class="legend-row" data-category="travel">
                <div class="legend-text scrollable-box">
                    <h3>Tajikistan</h3>
                    <p>Tajikistan is a mountainous country in Central Asia known for its dramatic natural beauty,
                        ancient history, and strong cultural traditions. More than 90 percent of the country is covered
                        by mountains, making it one of the most scenic destinations in the region. Travelers visiting
                        Tajikistan experience high-altitude roads, peaceful valleys, rivers, glaciers, and breathtaking
                        mountain landscapes that remain largely untouched by modern urbanization.

                        The Pamir Mountains, often called the “Roof of the World,” are one of Tajikistan’s most famous
                        natural attractions. These mountains attract adventurers, hikers, and photographers from around
                        the world. The Pamir Highway, one of the highest roads on Earth, offers unforgettable views of
                        valleys, lakes, and remote villages. Tajikistan’s natural environment makes it ideal for
                        adventure tourism, trekking, camping, and exploration.
                    </p>

                        Hospitality and respect for guests are highly valued in society, and visitors often experience
                        warm and welcoming communities. Traditional music, dance, poetry, and handcrafted textiles are
                        important cultural elements that reflect centuries of Central Asian and Persian influence.

                        Asia and the Middle East. Historical sites, old fortresses, and cultural landmarks show
                        Tajikistan’s historical importance in regional trade and civilization. Rural villages continue
                        preserving traditional lifestyles, clothing, and customs passed down through generations.
