<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Omari.to - Player</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/Codes/style.css">
    <link rel="icon" href="/Public/Images/Logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <style>
        :root {
            --primary: #d4bf86;
            --secondary: #dcc78e;
            --dark: #0f0f0f;
            --main: white;
            --accent: #FF9F1C;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: "Poppins", sans-serif; background: var(--dark); color: white; overflow-x: hidden; }
        a { text-decoration: none; color: white; }
        
        .top-navbar {
            position: fixed; top: 0; width: 100%; padding: 15px 4%;
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(15, 15, 15, 0.95); backdrop-filter: blur(20px);
            z-index: 1000; border-bottom: 1px solid rgba(255, 159, 28, 0.15);
        }
        .logo a { display: flex; align-items: center; text-decoration: none; }
        .logo img { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; border: 2px solid var(--primary); box-shadow: 0 0 15px rgba(212, 191, 134, 0.3); }
        .brand-name { font-family: "Playfair Display", serif; font-size: 22px; margin-left: 10px; font-weight: 600; color: white; letter-spacing: 1px; }
        .brand-name .dot { color: var(--primary); }
        
        .player-page { display: flex; gap: 24px; padding: 90px 3% 40px; min-height: 100vh; max-width: 100%; }
        
        .main-player { flex: 1; min-width: 0; display: flex; flex-direction: column; }
        .video-wrapper { position: relative; width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 12px; overflow: hidden; box-shadow: 0 0 30px rgba(255, 159, 28, 0.15), 0 8px 30px rgba(0, 0, 0, 0.5); }
        .video-wrapper video { width: 100%; height: 100%; object-fit: contain; display: block; background: #000; }
        .video-wrapper iframe { width: 100%; height: 100%; border: none; border-radius: 12px; }
        
        .player-controls { position: absolute; bottom: 0; left: 0; right: 0; padding: 16px 20px 20px; background: linear-gradient(transparent, rgba(0,0,0,0.9)); pointer-events: none; opacity: 0; transition: opacity 0.3s ease; z-index: 10; }
        .video-wrapper:hover .player-controls, .video-wrapper:focus-within .player-controls { opacity: 1; }
        .controls-inner { pointer-events: auto; display: flex; flex-direction: column; gap: 10px; }
        
        .progress-bar { height: 4px; background: rgba(255,255,255,0.2); border-radius: 2px; cursor: pointer; position: relative; }
        .progress-fill { height: 100%; background: var(--primary); border-radius: 2px; width: 0%; position: relative; }
        .progress-fill::after { content: ''; position: absolute; right: -6px; top: 50%; transform: translateY(-50%); width: 12px; height: 12px; background: var(--primary); border-radius: 50%; opacity: 0; transition: opacity 0.2s; }
        .progress-bar:hover .progress-fill::after { opacity: 1; }
        .time-display { display: flex; justify-content: space-between; font-size: 11px; color: #ccc; }
        
        .control-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
        .btn { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.15); color: white; padding: 8px 14px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; gap: 6px; font-size: 13px; transition: all 0.2s; }
        .btn:hover { background: var(--primary); border-color: var(--primary); color: #000; }
        .btn.active { background: var(--primary); border-color: var(--primary); color: #000; }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; }
        
        .volume-control { display: flex; align-items: center; gap: 8px; }
        .volume-slider { width: 80px; height: 4px; -webkit-appearance: none; appearance: none; background: rgba(255,255,255,0.2); border-radius: 2px; outline: none; cursor: pointer; }
        .volume-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px; background: var(--primary); border-radius: 50%; cursor: pointer; }
        
        .speed-menu { position: relative; }
        .speed-dropdown { position: absolute; bottom: 100%; left: 0; margin-bottom: 8px; background: #1a1a1a; border: 1px solid rgba(255,159,28,0.3); border-radius: 8px; padding: 8px; display: none; min-width: 80px; z-index: 20; }
        .speed-menu:hover .speed-dropdown, .speed-menu.open .speed-dropdown { display: block; }
        .speed-option { padding: 6px 12px; cursor: pointer; font-size: 13px; color: #ddd; transition: 0.2s; white-space: nowrap; }
        .speed-option:hover, .speed-option.active { background: var(--primary); color: #000; }
        
        .watch-tiktok-btn { margin-left: auto; background: linear-gradient(45deg, #000, #333); border: 1px solid #fff; color: #fff; }
        .watch-tiktok-btn:hover { background: #fff; color: #000; }
        
        .video-info { padding: 16px 0 8px; }
        .video-title { font-size: 18px; font-weight: 600; margin-bottom: 6px; }
        .video-meta { display: flex; gap: 16px; color: #888; font-size: 13px; flex-wrap: wrap; }
        .video-meta span { display: flex; align-items: center; gap: 4px; }
        
        .up-next-section { margin-top: 24px; }
        .up-next-title { font-size: 16px; font-weight: 600; margin-bottom: 12px; color: var(--primary); }
        .up-next-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
        .up-next-card { background: #1a1a1a; border: 1px solid rgba(255,255,255,0.05); border-radius: 10px; overflow: hidden; cursor: pointer; transition: 0.2s; }
        .up-next-card:hover { border-color: rgba(255,159,28,0.3); transform: translateY(-2px); }
        .up-next-thumb { width: 100%; aspect-ratio: 9/16; object-fit: cover; background: #222; }
        .up-next-info { padding: 8px; }
        .up-next-card-title { font-size: 12px; font-weight: 500; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .up-next-card-meta { font-size: 11px; color: #888; margin-top: 4px; display: flex; gap: 8px; }
        
        .sidebar { width: 320px; flex-shrink: 0; }
        .sidebar-section { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.05); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
        .sidebar-title { font-size: 14px; font-weight: 600; color: var(--primary); margin-bottom: 12px; }
        
        .playlist-item { display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 8px; cursor: pointer; transition: 0.2s; margin-bottom: 4px; }
        .playlist-item:hover { background: rgba(255,255,255,0.05); }
        .playlist-item.active { background: rgba(212,191,134,0.15); border: 1px solid var(--primary); }
        .playlist-thumb { width: 56px; height: 56px; border-radius: 6px; object-fit: cover; flex-shrink: 0; }
        .playlist-info { flex: 1; min-width: 0; }
        .playlist-item-title { font-size: 12px; font-weight: 500; line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .playlist-item-meta { font-size: 10px; color: #888; margin-top: 2px; }
        
        .loader-overlay { position: fixed; inset: 0; background: rgba(15,15,15,0.98); display: flex; align-items: center; justify-content: center; z-index: 9999; flex-direction: column; gap: 16px; }
        .loader-overlay.hidden { display: none; }
        .spinner { width: 60px; height: 60px; border: 4px solid rgba(255,159,28,0.2); border-top-color: var(--accent); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        .error-state { text-align: center; padding: 40px; color: #888; }
        .error-state i { font-size: 48px; color: #ff4d4d; margin-bottom: 16px; }
        .error-state button { margin-top: 16px; padding: 12px 24px; background: var(--primary); border: none; border-radius: 8px; color: #000; font-weight: 600; cursor: pointer; }
        
        @media (max-width: 1024px) {
            .player-page { flex-direction: column; }
            .sidebar { width: 100%; }
            .up-next-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
        }
        
        @media (max-width: 600px) {
            .top-navbar { padding: 12px 3%; }
            .brand-name { font-size: 18px; }
            .player-page { padding: 80px 2% 20px; gap: 16px; }
            .control-row { gap: 8px; }
            .btn { padding: 6px 10px; font-size: 12px; }
            .volume-slider { width: 60px; }
        }
        
        .video-wrapper.fullscreen { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; border-radius: 0; z-index: 9998; aspect-ratio: auto; }
        .video-wrapper.fullscreen .player-controls { opacity: 1; }
        
        .play-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.5); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 20; gap: 12px; cursor: pointer; }
        .play-overlay-btn { width: 80px; height: 80px; border-radius: 50%; background: var(--primary); border: none; color: #000; font-size: 28px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; box-shadow: 0 8px 30px rgba(255,159,28,0.4); }
        .play-overlay-btn:hover { transform: scale(1.1); box-shadow: 0 12px 40px rgba(255,159,28,0.6); }
        .play-overlay-text { color: #fff; font-size: 14px; text-shadow: 0 2px 8px rgba(0,0,0,0.5); }
        .play-overlay.hidden { display: none; }
    </style>
</head>
<body>
    <nav class="top-navbar">
        <div class="logo">
            <a href="/">
                <img src="/Public/Images/Logo.png" width="40" alt="Omari.to">
                <span class="brand-name">omari<span class="dot">.</span>to</span>
            </a>
        </div>
    </nav>

    <div id="loaderOverlay" class="loader-overlay">
        <img src="/Public/Images/Logo.png" class="spinner" alt="Loading">
        <span id="loaderText">Loading video...</span>
    </div>

    <div class="player-page">
        <main class="main-player">
<div class="video-wrapper" id="videoWrapper">
                    <video id="videoElement" class="video-element" playsinline webkit-playsinline></video>
                    <iframe id="youtubeIframe" class="video-element" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; fullscreen"></iframe>
                    
                    <div class="play-overlay" id="playOverlay" style="display: none;">
                        <button class="play-overlay-btn" id="playOverlayBtn" aria-label="Play video">
                            <i class="fa-solid fa-play"></i>
                        </button>
                        <span class="play-overlay-text">Click to Play</span>
                    </div>
                    
                    <div class="player-controls" id="playerControls">
                    <div class="controls-inner">
                        <div class="progress-bar" id="progressBar" role="slider" aria-label="Playback progress" tabindex="0">
                            <div class="progress-fill" id="progressFill"></div>
                        </div>
                        <div class="time-display">
                            <span id="currentTime">0:00</span>
                            <span id="totalTime">0:00</span>
                        </div>
                        <div class="control-row">
                            <button class="btn" id="prevBtn" title="Previous (Shift+Left)"><i class="fa-solid fa-backward-step"></i></button>
                            <button class="btn" id="playPauseBtn" title="Play/Pause (Space)"><i class="fa-solid fa-play" id="playIcon"></i><span id="playText">Play</span></button>
                            <button class="btn" id="nextBtn" title="Next (Shift+Right)"><i class="fa-solid fa-forward-step"></i></button>
                            <div class="volume-control">
                                <button class="btn" id="muteBtn" title="Mute (M)"><i class="fa-solid fa-volume-high" id="volumeIcon"></i></button>
                                <input type="range" class="volume-slider" id="volumeSlider" min="0" max="1" step="0.1" value="1" aria-label="Volume">
                            </div>
                            <div class="speed-menu" id="speedMenu">
                                <button class="btn" id="speedBtn" title="Playback Speed"><i class="fa-solid fa-gauge"></i><span id="speedText">1x</span></button>
                                <div class="speed-dropdown" id="speedDropdown">
                                    <div class="speed-option" data-speed="0.5">0.5x</div>
                                    <div class="speed-option" data-speed="0.75">0.75x</div>
                                    <div class="speed-option active" data-speed="1">1x (Normal)</div>
                                    <div class="speed-option" data-speed="1.25">1.25x</div>
                                    <div class="speed-option" data-speed="1.5">1.5x</div>
                                    <div class="speed-option" data-speed="2">2x</div>
                                </div>
                            </div>
                            <button class="btn" id="fullscreenBtn" title="Fullscreen (F)"><i class="fa-solid fa-expand" id="fullscreenIcon"></i></button>
                            <a class="btn watch-tiktok-btn" id="watchOnTiktokBtn" href="#" target="_blank" rel="noopener"><i class="fa-brands fa-tiktok"></i> Watch on TikTok</a>
                        </div>
                    </div>
                </div>
            </div>

            <div class="video-info" id="videoInfo">
                <h2 class="video-title" id="videoTitle">Loading...</h2>
                <div class="video-meta" id="videoMeta"></div>
            </div>

            <div class="up-next-section">
                <h3 class="up-next-title">Up Next</h3>
                <div class="up-next-grid" id="upNextGrid"></div>
            </div>
        </main>

        <aside class="sidebar">
            <div class="sidebar-section">
                <h4 class="sidebar-title">Playlist</h4>
                <div id="playlistContainer"></div>
            </div>
        </aside>
    </div>

    <script>
        const API_BASE = (window.location.port === "3000") ? "" : "http://localhost:3000";
        
        const videoWrapper = document.getElementById('videoWrapper');
        const videoElement = document.getElementById('videoElement');
        const youtubeIframe = document.getElementById('youtubeIframe');
        const loaderOverlay = document.getElementById('loaderOverlay');
        const loaderText = document.getElementById('loaderText');
        
        const playPauseBtn = document.getElementById('playPauseBtn');
        const playIcon = document.getElementById('playIcon');
        const playText = document.getElementById('playText');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const muteBtn = document.getElementById('muteBtn');
        const volumeIcon = document.getElementById('volumeIcon');
        const volumeSlider = document.getElementById('volumeSlider');
        const speedBtn = document.getElementById('speedBtn');
        const speedText = document.getElementById('speedText');
        const speedDropdown = document.getElementById('speedDropdown');
        const speedMenu = document.getElementById('speedMenu');
        const fullscreenBtn = document.getElementById('fullscreenBtn');
        const fullscreenIcon = document.getElementById('fullscreenIcon');
        const watchOnTiktokBtn = document.getElementById('watchOnTiktokBtn');
        const progressBar = document.getElementById('progressBar');
        const progressFill = document.getElementById('progressFill');
        const currentTimeEl = document.getElementById('currentTime');
        const totalTimeEl = document.getElementById('totalTime');
        const videoTitleEl = document.getElementById('videoTitle');
        const videoMetaEl = document.getElementById('videoMeta');
        const upNextGrid = document.getElementById('upNextGrid');
        const playlistContainer = document.getElementById('playlistContainer');
        const playOverlay = document.getElementById('playOverlay');
        const playOverlayBtn = document.getElementById('playOverlayBtn');
        
        let currentVideoType = null; // 'tiktok' or 'youtube'
        let currentVideoId = null;
        let currentVideoData = null;
        let playlistVideos = [];
        let currentPlaylistIndex = -1;
        let isYouTubeReady = false;
        let youtubePlayer = null;
        let isFullscreen = false;
        
        function formatTime(seconds) {
            if (!seconds || isNaN(seconds)) return '0:00';
            const h = Math.floor(seconds / 3600);
            const m = Math.floor((seconds % 3600) / 60);
            const s = Math.floor(seconds % 60);
            if (h > 0) return `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
            return `${m}:${String(s).padStart(2,'0')}`;
        }
        
        function formatStat(num) {
            if (num === null || num === undefined) return "0";
            const n = Number(num);
            if (isNaN(n)) return "0";
            if (n < 1000) return n.toString();
            function clean(val, suffix) {
                let s = val < 1000 ? val.toFixed(2) : Math.round(val).toString();
                if (s.includes('.')) s = s.replace(/0+$/, '').replace(/\.$/, '');
                return s + suffix;
            }
            if (n < 1000000) return clean(n / 1000, "K");
            if (n < 1000000000) return clean(n / 1000000, "M");
            return clean(n / 1000000000, "B");
        }
        
        function showLoader(text = 'Loading video...') {
            loaderText.textContent = text;
            loaderOverlay.classList.remove('hidden');
        }
        
        function hideLoader() {
            loaderOverlay.classList.add('hidden');
        }
        
        function showError(message, retryUrl = null) {
            videoWrapper.innerHTML = `
                <div class="error-state">
                    <i class="fa-solid fa-triangle-exclamation"></i>
                    <h3>Unable to Play Video</h3>
                    <p>${message}</p>
                    ${retryUrl ? `<a href="${retryUrl}" target="_blank" class="btn watch-tiktok-btn"><i class="fa-brands fa-tiktok"></i> Watch on TikTok</a>` : ''}
                    <button onclick="location.reload()" class="btn">Retry</button>
                </div>
            `;
        }
        
        async function loadTikTokVideo(videoId, isRetry = false) {
            showLoader('Resolving TikTok video...');
            try {
                const res = await fetch(`${API_BASE}/tiktok-video?id=${encodeURIComponent(videoId)}`);
                const data = await res.json();
                if (!data.success || !data.video) throw new Error(data.error || 'Video not found');
                
                currentVideoData = data.video;
                updateVideoInfo(data.video);
                
                const playRes = await fetch(`${API_BASE}/tiktok-play?id=${encodeURIComponent(videoId)}`);
                const playData = await playRes.json();
                
                if (!playData.success || !playData.playUrl) {
                    throw new Error('No playable stream found. The video may be deleted or private.');
                }
                
                // Check if it's audio-only (some TikTok music videos only have audio)
                const isAudioOnly = playData.playUrl.includes('mime_type=audio_mp4');
                
                videoElement.src = playData.playUrl;
                videoElement.style.display = 'block';
                youtubeIframe.style.display = 'none';
                videoWrapper.classList.add('mode-tiktok');
                videoWrapper.classList.remove('mode-youtube');
                watchOnTiktokBtn.href = playData.watchUrl || `https://www.tiktok.com/@${data.video.username}/video/${videoId}`;
                watchOnTiktokBtn.style.display = 'inline-flex';
                
                // Track retry attempts to prevent infinite reload loops
                videoElement.dataset.retryCount = videoElement.dataset.retryCount || '0';
                
                // Try autoplay, but handle browser autoplay policy
                videoElement.play().then(() => {
                    // Autoplay worked
                    playOverlay.classList.add('hidden');
                    updatePlayPauseUI(true);
                }).catch(() => {
                    // Autoplay blocked - show play overlay
                    playOverlay.classList.remove('hidden');
                    updatePlayPauseUI(false);
                });
                
                loadUpNext(videoId);
                loadPlaylist(data.video.username || 'omari.to');
                
                return true;
            } catch (err) {
                console.error('TikTok load error:', err);
                // Only retry once to get a fresh URL from resolver
                if (!isRetry) {
                    console.log('Retrying with fresh URL...');
                    // Clear the cached playUrl in backend by forcing a fresh fetch
                    await fetch(`${API_BASE}/tiktok-play?id=${encodeURIComponent(videoId)}&force=1`).catch(() => {});
                    return loadTikTokVideo(videoId, true);
                }
                showError(err.message, `https://www.tiktok.com/@omari.to/video/${videoId}`);
                return false;
            } finally {
                hideLoader();
            }
        }
        
        function loadYouTubeVideo(videoId) {
            showLoader('Loading YouTube video...');
            currentVideoData = { videoId, type: 'youtube' };
            videoTitleEl.textContent = 'YouTube Video';
            videoMetaEl.innerHTML = '<span>YouTube</span>';
            watchOnTiktokBtn.style.display = 'none';
            
            videoElement.style.display = 'none';
            youtubeIframe.style.display = 'block';
            videoWrapper.classList.add('mode-youtube');
            videoWrapper.classList.remove('mode-tiktok');
            
            if (typeof YT !== 'undefined' && YT.Player) {
                initYouTubePlayer(videoId);
            } else {
                window.onYouTubeIframeAPIReady = () => initYouTubePlayer(videoId);
            }
            
            loadUpNext(videoId);
            loadPlaylist('omari.to');
            hideLoader();
        }
        
        function initYouTubePlayer(videoId) {
            if (youtubePlayer) {
                youtubePlayer.loadVideoById(videoId);
                return;
            }
            youtubePlayer = new YT.Player('youtubeIframe', {
                videoId: videoId,
                playerVars: {
                    'autoplay': 1,
                    'controls': 0,
                    'disablekb': 1,
                    'fs': 0,
                    'iv_load_policy': 3,
                    'modestbranding': 1,
                    'playsinline': 1,
                    'rel': 0,
                    'showinfo': 0
                },
                events: {
                    'onReady': (e) => {
                        isYouTubeReady = true;
                        e.target.playVideo();
                        updatePlayPauseUI(true);
                    },
                    'onStateChange': (e) => {
                        if (e.data === YT.PlayerState.PLAYING) updatePlayPauseUI(true);
                        else if (e.data === YT.PlayerState.PAUSED) updatePlayPauseUI(false);
                        else if (e.data === YT.PlayerState.ENDED) playNext();
                    },
                    'onError': (e) => {
                        console.error('YouTube player error:', e.data);
                        showError('YouTube video unavailable. It may be private or deleted.');
                    }
                }
            });
        }
        
        function updateVideoInfo(video) {
            videoTitleEl.textContent = video.title || 'TikTok Video';
            const meta = [];
            if (video.creator) meta.push(`<span><i class="fa-solid fa-user"></i> @${video.username || video.creator}</span>`);
            if (video.views) meta.push(`<span><i class="fa-solid fa-eye"></i> ${formatStat(video.views)}</span>`);
            if (video.likes) meta.push(`<span><i class="fa-solid fa-heart"></i> ${formatStat(video.likes)}</span>`);
            if (video.comments) meta.push(`<span><i class="fa-solid fa-comment"></i> ${formatStat(video.comments)}</span>`);
            if (video.duration) meta.push(`<span><i class="fa-solid fa-clock"></i> ${formatTime(video.duration)}</span>`);
            videoMetaEl.innerHTML = meta.join('');
        }
        
        async function loadUpNext(excludeId) {
            try {
                const res = await fetch(`${API_BASE}/tiktok-upnext?exclude=${encodeURIComponent(excludeId)}&limit=6`);
                const data = await res.json();
                if (data.success && data.videos.length) {
                    upNextGrid.innerHTML = data.videos.map(v => `
                        <div class="up-next-card" data-id="${v.id}" data-type="tiktok">
                            <img class="up-next-thumb" src="${v.thumbnail || ''}" alt="" loading="lazy" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"160\" height=\"284\"><rect fill=\"%23222\" width=\"100%\" height=\"100%\"/></svg>'">
                            <div class="up-next-info">
                                <div class="up-next-card-title">${v.title || 'TikTok Video'}</div>
                                <div class="up-next-card-meta">
                                    <span>${formatStat(v.views)} views</span>
                                    <span>${formatTime(v.duration)}</span>
                                </div>
                            </div>
                        </div>
                    `).join('');
                    upNextGrid.querySelectorAll('.up-next-card').forEach(card => {
                        card.addEventListener('click', () => loadVideo(card.dataset.id, card.dataset.type));
                    });
                }
            } catch (err) {
                console.error('Up next load error:', err);
            }
        }
        
        async function loadPlaylist(username) {
            try {
                const res = await fetch(`${API_BASE}/tiktok-grid-videos?username=${encodeURIComponent(username)}&limit=50`);
                const data = await res.json();
                if (data.success && data.videos.length) {
                    playlistVideos = data.videos;
                    currentPlaylistIndex = playlistVideos.findIndex(v => v.id === currentVideoId);
                    renderPlaylist();
                }
            } catch (err) {
                console.error('Playlist load error:', err);
            }
        }
        
        function renderPlaylist() {
            playlistContainer.innerHTML = playlistVideos.slice(0, 20).map((v, i) => `
                <div class="playlist-item ${i === currentPlaylistIndex ? 'active' : ''}" data-id="${v.id}" data-type="tiktok">
                    <img class="playlist-thumb" src="${v.thumbnail || ''}" alt="" loading="lazy" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"56\" height=\"56\"><rect fill=\"%23222\" width=\"100%\" height=\"100%\"/></svg>'">
                    <div class="playlist-info">
                        <div class="playlist-item-title">${v.title || 'TikTok Video'}</div>
                        <div class="playlist-item-meta">${formatStat(v.views)} views • ${formatTime(v.duration)}</div>
                    </div>
                </div>
            `).join('');
            playlistContainer.querySelectorAll('.playlist-item').forEach(item => {
                item.addEventListener('click', () => {
                    loadVideo(item.dataset.id, item.dataset.type);
                });
            });
        }
        
        function updatePlayPauseUI(playing) {
            if (playing) {
                playIcon.className = 'fa-solid fa-pause';
                playText.textContent = 'Pause';
            } else {
                playIcon.className = 'fa-solid fa-play';
                playText.textContent = 'Play';
            }
        }
        
        function togglePlayPause() {
            if (currentVideoType === 'tiktok') {
                if (videoElement.paused) videoElement.play();
                else videoElement.pause();
            } else if (currentVideoType === 'youtube' && youtubePlayer) {
                const state = youtubePlayer.getPlayerState();
                if (state === YT.PlayerState.PLAYING) youtubePlayer.pauseVideo();
                else youtubePlayer.playVideo();
            }
        }
        
        function playPrev() {
            if (currentPlaylistIndex > 0) {
                const prevVideo = playlistVideos[currentPlaylistIndex - 1];
                loadVideo(prevVideo.id, 'tiktok');
            }
        }
        
        function playNext() {
            if (currentPlaylistIndex < playlistVideos.length - 1) {
                const nextVideo = playlistVideos[currentPlaylistIndex + 1];
                loadVideo(nextVideo.id, 'tiktok');
            }
        }
        
        function toggleMute() {
            if (currentVideoType === 'tiktok') {
                videoElement.muted = !videoElement.muted;
                volumeIcon.className = videoElement.muted ? 'fa-solid fa-volume-xmark' : 'fa-solid fa-volume-high';
                volumeSlider.value = videoElement.muted ? 0 : videoElement.volume;
            } else if (currentVideoType === 'youtube' && youtubePlayer) {
                const muted = youtubePlayer.isMuted();
                if (muted) youtubePlayer.unMute();
                else youtubePlayer.mute();
                volumeIcon.className = !muted ? 'fa-solid fa-volume-xmark' : 'fa-solid fa-volume-high';
                volumeSlider.value = muted ? 1 : 0;
            }
        }
        
        function setVolume(value) {
            const vol = parseFloat(value);
            if (currentVideoType === 'tiktok') {
                videoElement.volume = vol;
                videoElement.muted = vol === 0;
                volumeIcon.className = vol === 0 ? 'fa-solid fa-volume-xmark' : 'fa-solid fa-volume-high';
            } else if (currentVideoType === 'youtube' && youtubePlayer) {
                youtubePlayer.setVolume(vol * 100);
                youtubePlayer.mute(vol === 0);
                volumeIcon.className = vol === 0 ? 'fa-solid fa-volume-xmark' : 'fa-solid fa-volume-high';
            }
        }
        
        function setSpeed(speed) {
            speedText.textContent = `${speed}x`;
            speedDropdown.querySelectorAll('.speed-option').forEach(opt => {
                opt.classList.toggle('active', parseFloat(opt.dataset.speed) === speed);
            });
            if (currentVideoType === 'tiktok') {
                videoElement.playbackRate = speed;
            } else if (currentVideoType === 'youtube' && youtubePlayer) {
                youtubePlayer.setPlaybackRate(speed);
            }
            speedMenu.classList.remove('open');
        }
        
        function toggleFullscreen() {
            if (!isFullscreen) {
                if (videoWrapper.requestFullscreen) videoWrapper.requestFullscreen();
                else if (videoWrapper.webkitRequestFullscreen) videoWrapper.webkitRequestFullscreen();
                else if (videoWrapper.msRequestFullscreen) videoWrapper.msRequestFullscreen();
                isFullscreen = true;
                fullscreenIcon.className = 'fa-solid fa-compress';
                videoWrapper.classList.add('fullscreen');
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
                else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
                else if (document.msExitFullscreen) document.msExitFullscreen();
                isFullscreen = false;
                fullscreenIcon.className = 'fa-solid fa-expand';
                videoWrapper.classList.remove('fullscreen');
            }
        }
        
        function updateProgress() {
            let current, duration;
            if (currentVideoType === 'tiktok') {
                current = videoElement.currentTime;
                duration = videoElement.duration;
            } else if (currentVideoType === 'youtube' && youtubePlayer) {
                current = youtubePlayer.getCurrentTime();
                duration = youtubePlayer.getDuration();
            }
            if (duration) {
                const percent = (current / duration) * 100;
                progressFill.style.width = `${percent}%`;
                currentTimeEl.textContent = formatTime(current);
                totalTimeEl.textContent = formatTime(duration);
            }
        }
        
        function seekTo(percent) {
            if (currentVideoType === 'tiktok' && videoElement.duration) {
                videoElement.currentTime = (percent / 100) * videoElement.duration;
            } else if (currentVideoType === 'youtube' && youtubePlayer) {
                youtubePlayer.seekTo((percent / 100) * youtubePlayer.getDuration(), true);
            }
        }
        
        function loadVideo(id, type) {
            currentVideoId = id;
            currentVideoType = type;
            if (type === 'tiktok') loadTikTokVideo(id);
            else if (type === 'youtube') loadYouTubeVideo(id);
        }
        
        // Event listeners
        playPauseBtn.addEventListener('click', togglePlayPause);
        prevBtn.addEventListener('click', playPrev);
        nextBtn.addEventListener('click', playNext);
        muteBtn.addEventListener('click', toggleMute);
        volumeSlider.addEventListener('input', (e) => setVolume(e.target.value));
        fullscreenBtn.addEventListener('click', toggleFullscreen);
        
        // Play overlay click
        playOverlay.addEventListener('click', () => {
            if (currentVideoType === 'tiktok') {
                videoElement.play().then(() => {
                    playOverlay.classList.add('hidden');
                });
            }
        });
        playOverlayBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            if (currentVideoType === 'tiktok') {
                videoElement.play().then(() => {
                    playOverlay.classList.add('hidden');
                });
            }
        });
        
        progressBar.addEventListener('click', (e) => {
            const rect = progressBar.getBoundingClientRect();
            const percent = ((e.clientX - rect.left) / rect.width) * 100;
            seekTo(percent);
        });
        
        progressBar.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') { e.preventDefault(); seekTo(Math.max(0, (videoElement.currentTime / videoElement.duration * 100) - 5)); }
            else if (e.key === 'ArrowRight') { e.preventDefault(); seekTo(Math.min(100, (videoElement.currentTime / videoElement.duration * 100) + 5)); }
        });
        
        speedBtn.addEventListener('click', () => speedMenu.classList.toggle('open'));
        speedDropdown.addEventListener('click', (e) => {
            const opt = e.target.closest('.speed-option');
            if (opt) setSpeed(parseFloat(opt.dataset.speed));
        });
        document.addEventListener('click', (e) => {
            if (!speedMenu.contains(e.target)) speedMenu.classList.remove('open');
        });
        
        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
            if (e.code === 'Space') { e.preventDefault(); togglePlayPause(); }
            else if (e.code === 'KeyM') toggleMute();
            else if (e.code === 'KeyF') toggleFullscreen();
            else if (e.code === 'ArrowLeft' && !e.shiftKey) { e.preventDefault(); seekTo(Math.max(0, (videoElement.currentTime / videoElement.duration * 100) - 5)); }
            else if (e.code === 'ArrowRight' && !e.shiftKey) { e.preventDefault(); seekTo(Math.min(100, (videoElement.currentTime / videoElement.duration * 100) + 5)); }
            else if (e.code === 'ArrowLeft' && e.shiftKey) playPrev();
            else if (e.code === 'ArrowRight' && e.shiftKey) playNext();
            else if (e.code === 'ArrowUp') { e.preventDefault(); setVolume(Math.min(1, (currentVideoType === 'tiktok' ? videoElement.volume : (youtubePlayer?.getVolume() || 100)/100) + 0.1)); volumeSlider.value = currentVideoType === 'tiktok' ? videoElement.volume : (youtubePlayer?.getVolume() || 100)/100; }
            else if (e.code === 'ArrowDown') { e.preventDefault(); setVolume(Math.max(0, (currentVideoType === 'tiktok' ? videoElement.volume : (youtubePlayer?.getVolume() || 100)/100) - 0.1)); volumeSlider.value = currentVideoType === 'tiktok' ? videoElement.volume : (youtubePlayer?.getVolume() || 100)/100; }
        });
        
        // Video element events
        videoElement.addEventListener('play', () => {
            updatePlayPauseUI(true);
            playOverlay.classList.add('hidden');
        });
        videoElement.addEventListener('pause', () => {
            updatePlayPauseUI(false);
            playOverlay.classList.remove('hidden');
        });
        videoElement.addEventListener('timeupdate', updateProgress);
        videoElement.addEventListener('loadedmetadata', () => {
            totalTimeEl.textContent = formatTime(videoElement.duration);
        });
        videoElement.addEventListener('ended', playNext);
        videoElement.addEventListener('error', (e) => {
            console.error('Video error:', videoElement.error);
            showError('Video playback failed. The stream may have expired.', currentVideoData?.webVideoUrl);
        });
        videoElement.addEventListener('waiting', () => showLoader('Buffering...'));
        videoElement.addEventListener('playing', hideLoader);
        
        // Fullscreen change
        document.addEventListener('fullscreenchange', () => {
            isFullscreen = !!document.fullscreenElement;
            fullscreenIcon.className = isFullscreen ? 'fa-solid fa-compress' : 'fa-solid fa-expand';
            videoWrapper.classList.toggle('fullscreen', isFullscreen);
        });
        
        // Initialize from URL params
        const params = new URLSearchParams(window.location.search);
        const type = params.get('type') || 'tiktok';
        const id = params.get('id');
        
        if (id) {
            loadVideo(id, type);
        } else {
            showError('No video ID provided');
        }
        
        // Load YouTube API
        if (!window.YT) {
            const tag = document.createElement('script');
            tag.src = 'https://www.youtube.com/iframe_api';
            document.head.appendChild(tag);
        }
    </script>
</body>
</html>
